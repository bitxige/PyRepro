[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrepro"
version = "0.1.0"
description = "Execution-verified failure reduction for Python projects."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "PyRepro contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
pyrepro = "pyrepro.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyrepro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["pyrepro", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "D100", "D101", "D102", "D103", "D104", "D107"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"examples/failing_project/**" = ["D100", "D101", "D102", "D103", "D104", "D107"]
"examples/grouped_failure/**" = ["D100", "D101", "D102", "D103", "D104", "D107"]
"examples/training_failure/**" = ["D100", "D101", "D102", "D103", "D104", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
